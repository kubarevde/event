# Запуск: docker compose up -d --build
# Настройки — в файле .env рядом (образец: .env.example)
# HTTPS и сертификат обеспечивает WAF; сюда он проксирует запросы по http на APP_PORT.

services:
  app:
    build: .
    image: event-landing:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/storage
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - site-data:/app/storage

volumes:
  site-data:     # база, заявки, статистика, загруженные картинки — БЭКАПИТЬ
