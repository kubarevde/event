# Запуск: docker compose up -d --build
# Настройки — в файле .env рядом (образец: .env.example)
# Сайт слушает только localhost (APP_BIND:APP_PORT); снаружи его отдаёт nginx на сервере за WAF.

services:
  app:
    build: .
    image: event-landing:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/storage
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3001}:3000"
    volumes:
      - site-data:/app/storage

volumes:
  site-data:     # база, заявки, статистика, загруженные картинки — БЭКАПИТЬ
